
[package]
name = "hamt-core"
version = "0.2.1"
edition = "2024"
authors = ["Junfeng Xiao"]
description = "Coupled heat and moisture transport (HAMT) solver for building constructions"
license = "Apache-2.0"
repository = "https://github.com/JunfXiao/hamt"
readme = "../README.md"
keywords = ["hygrothermal", "building-physics", "simulation", "moisture", "heat-transfer"]
categories = ["science", "simulation"]

[dependencies]
tracing = "0.1.44"
thiserror = "2.0.18"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0.100"
ndarray = "0.17.2"
rayon = { version = "1.11.0", optional = true }
diman = { version = "0.5.1", features = ["serde"] }
strum = { version = "0.27.2", features = ["derive", "strum_macros"] }
strum_macros = "0.27.2"


[dev-dependencies]
crossterm = "0.29.0"
tempfile = "3.24.0"
ctrlc = "3.5.1"
textwrap = "0.16"
tracing-test = "0.2.5"
tracing-subscriber = { version = "0.3.22", features = [
    "serde",
    "tracing-serde",
    "env-filter",
    "time",
    "local-time",
] }

[features]
parallel = ["rayon"]
default = ["parallel"]
