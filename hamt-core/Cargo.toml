
[package]
name = "hamt-core"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = [
    "serde",
    "tracing-serde",
    "env-filter",
    "time",
    "local-time",
] }
thiserror = "2.0.18"
csv = "1.4"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0.100"
ndarray = "0.17.2"
rayon = "1.11.0"
diman = { version = "0.5.1", features = ["serde"] }
tracing-test = "0.2.5"
strum = { version = "0.27.2", features = ["derive", "strum_macros"] }
strum_macros = "0.27.2"
