
[package]
name = "trnsys_hamt_rs"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package.metadata.trnsys]
type_number = 395

[lib]
name = "trnsys_hamt_rs"
path = "src/lib.rs"
crate-type = ["cdylib"]


[dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = [
    "serde",
    "tracing-serde",
    "env-filter",
    "time",
    "local-time",
] }
thiserror = "2.0.18"
csv = "1.4"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0.100"
ndarray = "0.17.2"
rayon = "1.11.0"
tracing-test = "0.2.5"


[build-dependencies]
toml = "0.8"
