
[package]
name = "trnsys_hamt_rs"
version = "0.2.1"
edition = "2024"
authors = ["Junfeng Xiao"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package.metadata.trnsys]
type_number = 395

[lib]
name = "trnsys_hamt_rs"
path = "src/lib.rs"
crate-type = ["cdylib"]


[dependencies]
hamt-core = { path = "../hamt-core" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = [
    "serde",
    "tracing-serde",
    "env-filter",
    "time",
    "local-time",
] }
thiserror = "2.0.18"
csv = "1.4"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0.100"
ndarray = "0.17.2"
rayon = "1.11.0"
diman = { version = "0.5.1", features = ["serde"] }
tracing-test = "0.2.5"
winapi-util = "0.1.11"

[build-dependencies]
toml = "0.8"
winres = "0.1"

[features]
default = []